# GitHub Actions workflow para automatic na ma-check ang project.
name: CI

# Tatakbo kapag may push sa main o may Pull Request.
on:
  push:
    branches: [main]
  pull_request:

# Read-only lang ang permission ng workflow sa repository.
permissions:
  contents: read

jobs:
  test:
    # Ubuntu Linux ang gagamiting temporary machine.
    runs-on: ubuntu-latest

    # Nasa subfolder ang project natin, kaya dito tatakbo ang commands.
    defaults:
      run:
        working-directory: Express TS

    # Temporary PostgreSQL database para sa tests.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: express_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Temporary environment variables para sa CI tests.
    # Hindi ito ang actual credentials ng production database.
    env:
      NODE_ENV: test
      PORT: "3000"
      FRONTEND_URL: http://localhost:5173
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: express_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-run-only-0123456789abcdef0123456789abcdef

    steps:
      # Kinukuha ang latest code mula sa GitHub repository.
      - uses: actions/checkout@v4

      # Ini-install ang Node.js at sini-set up ang npm cache.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Express TS/package-lock.json

      # Ini-install ang exact dependency versions mula sa package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Ginagawa ang database tables na kailangan ng tests.
      - name: Create the database tables
        run: psql "postgresql://postgres:postgres@localhost:5432/express_test" -v ON_ERROR_STOP=1 -f db/schema.sql

      # Tinitingnan kung successful ang TypeScript compilation.
      - name: Build
        run: npm run build

      # Pinapatakbo ang lahat ng tests.
      - name: Test
        run: npx vitest run

      # Chine-check kung may high o critical vulnerabilities
      # sa production dependencies.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
